[package]
name = "hailr-tui"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "hailr"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hailr-core.workspace = true
hailr-herdr.workspace = true
thiserror = "2"
tokio = { version = "1.54", features = ["net", "rt", "sync"] }
tokio-stream = "0.1.19"
url = "2"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.28", features = ["v4"] }
