[package]
name = "hailr-tui"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "hailr"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hailr-core.workspace = true
hailr-herdr.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
toml = "1"
url = "2"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1"
tokio = { version = "1.54", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.28", features = ["v4"] }
